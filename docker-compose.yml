version: '3.8'

# =============================================================================
# PRODUCTION DOCKER COMPOSE
# Usage: docker-compose up -d
# =============================================================================

services:
  jellyshare:
    image: ghcr.io/melth-cmd/jellyshare:0.4.0
    container_name: jellyshare
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      - JELLYSHARE_ENV=production
      - JELLYSHARE_PORT=8097
      - JELLYSHARE_DB_DSN=postgres://jellyshare:${POSTGRES_PASSWORD:-jellyshare}@postgres:5432/jellyshare?sslmode=disable
      - JELLYSHARE_JELLYFIN_BASE_URL=${JELLYFIN_URL}
      - JELLYSHARE_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - JELLYSHARE_BACKEND_API_KEY=${BACKEND_API_KEY}
      - JELLYSHARE_PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8097}
      - JELLYSHARE_SESSION_HEARTBEAT_TIMEOUT_SECONDS=120
      - JELLYSHARE_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jellyshare-network
    # Uncomment if Jellyfin runs on host
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: jellyshare-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=jellyshare
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jellyshare}
      - POSTGRES_DB=jellyshare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyshare"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jellyshare-network

volumes:
  postgres_data:

networks:
  jellyshare-network:
    driver: bridge
