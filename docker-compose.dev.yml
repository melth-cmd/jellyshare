
# Development environment with hot reload
# Usage: docker-compose -f docker-compose.dev.yml up

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: jellyshare-dev
    volumes:
      - .:/workspace:cached
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - node-modules:/workspace/web/node_modules
    ports:
      # Bound to all interfaces so another machine can reach the dev UI.
      # Production keeps 8097; the dev stack uses 8098.
      - "${DEV_HOST_IP:-0.0.0.0}:8098:8097"
      - "${DEV_HOST_IP:-0.0.0.0}:5173:5173"
    environment:
      - JELLYSHARE_ENV=development
      - JELLYSHARE_PORT=8097
      - JELLYSHARE_DB_DSN=postgres://jellyshare:jellyshare@postgres:5432/jellyshare?sslmode=disable
      - JELLYSHARE_JELLYFIN_BASE_URL=${JELLYFIN_URL:-http://host.docker.internal:8096}
      - JELLYSHARE_JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-your-api-key}
      - JELLYSHARE_BACKEND_API_KEY=${BACKEND_API_KEY:-dev-backend-key-change-in-prod}
      - JELLYSHARE_PUBLIC_BASE_URL=${DEV_PUBLIC_BASE_URL:-http://localhost:8098}
      - JELLYSHARE_LOG_LEVEL=debug
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    # For connecting to host services (like Jellyfin running on host)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    container_name: jellyshare-db-dev
    environment:
      - POSTGRES_USER=jellyshare
      - POSTGRES_PASSWORD=jellyshare
      - POSTGRES_DB=jellyshare
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Use 5433 externally to avoid conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyshare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jellyshare-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@local.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres-dev-data:
  go-mod-cache:
  go-build-cache:
  node-modules:
